<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanhedrin Terminal Demo</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-deep: #121225;
      --panel: rgba(14, 18, 35, 0.9);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e0e0e0;
      --dim: rgba(224, 224, 224, 0.58);
      --muted: rgba(224, 224, 224, 0.34);
      --user: #cfd7ff;
      --teal: #5f9ea0;
      --red: #cd5c5c;
      --gold: #daa520;
      --blue: #6495ed;
      --purple: #9370db;
      --akiva: #e0913e;
      --glow: rgba(224, 224, 224, 0.14);
      --accent: rgba(224, 224, 224, 0.84);
      --shadow: 0 0 4px rgba(224, 224, 224, 0.035), 0 0 10px rgba(120, 155, 255, 0.03);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(102, 122, 191, 0.12), transparent 38%),
        radial-gradient(circle at 80% 20%, rgba(224, 145, 62, 0.08), transparent 28%),
        linear-gradient(180deg, #17172c 0%, #111223 100%);
      color: var(--text);
      font-family: "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: min(80ch, calc(100vw - 24px));
      min-height: min(92dvh, 960px);
      border-radius: calc(var(--radius) + 4px);
      padding: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .terminal {
      position: relative;
      min-height: calc(min(92dvh, 960px) - 20px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(8, 10, 20, 0.9), rgba(14, 16, 31, 0.96)),
        var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 -1px 0 rgba(255, 255, 255, 0.03);
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.16;
      mix-blend-mode: screen;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
    }

    .lights {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .light:nth-child(1) { background: rgba(205, 92, 92, 0.7); }
    .light:nth-child(2) { background: rgba(218, 165, 32, 0.65); }
    .light:nth-child(3) { background: rgba(95, 158, 160, 0.68); }

    .title {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.008));
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn,
    .speed-btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 420ms cubic-bezier(0.32, 0.72, 0, 1), background 420ms cubic-bezier(0.32, 0.72, 0, 1), border-color 420ms cubic-bezier(0.32, 0.72, 0, 1), opacity 420ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .btn:hover,
    .speed-btn:hover,
    .btn:focus-visible,
    .speed-btn:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    .speed-btn.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.26);
      color: #ffffff;
    }

    .btn[hidden] {
      display: none;
    }

    .status {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.05em;
      min-width: 78px;
      text-align: right;
    }

    .viewport {
      position: relative;
      overflow-y: auto;
      padding: 22px 18px 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .viewport::-webkit-scrollbar {
      width: 8px;
    }

    .viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .content {
      min-height: 100%;
      text-shadow: var(--shadow);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      font-size: clamp(14px, 1.75vw, 16px);
      position: relative;
      z-index: 1;
      opacity: 1;
      transition: opacity 500ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .content.fade-out {
      opacity: 0;
      transition-duration: 180ms;
    }

    .line {
      margin: 0 0 0.85rem;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 700ms cubic-bezier(0.32, 0.72, 0, 1), transform 700ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .system {
      color: var(--dim);
    }

    .user {
      color: var(--user);
    }

    .advisor .name {
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .advisor.sun .name { color: var(--teal); }
    .advisor.mach .name { color: var(--red); }
    .advisor.mai .name { color: var(--gold); }
    .advisor.schelling .name { color: var(--blue); }
    .advisor.talleyrand .name { color: var(--purple); }
    .advisor.akiva .name { color: var(--akiva); }

    .advisor .body {
      color: var(--text);
    }

    .glow {
      color: #f0e2ca;
      text-shadow:
        0 0 6px rgba(224, 145, 62, 0.16),
        0 0 14px rgba(240, 226, 202, 0.08),
        var(--shadow);
    }

    .cluster {
      color: var(--accent);
    }

    .spinner {
      color: var(--muted);
      letter-spacing: 0.26em;
      min-height: 1.4em;
    }

    .cursor {
      display: inline-block;
      width: 0.62ch;
      height: 1.05em;
      margin-left: 1px;
      vertical-align: -0.15em;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
      animation: blink 1s steps(1, end) infinite;
    }

    .closing {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: min(62vh, 420px);
      padding: 24px 0;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1200ms cubic-bezier(0.32, 0.72, 0, 1), transform 1200ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .closing.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .closing-inner {
      display: grid;
      gap: 0.9rem;
      justify-items: center;
    }

    .closing-title {
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f1efe8;
    }

    .closing-copy {
      color: var(--dim);
    }

    .closing-copy.dimmer {
      color: rgba(224, 224, 224, 0.5);
    }

    .closing-link {
      color: #f2d3ac;
    }

    .closing-link-text.pulsing {
      animation: closingLinkPulse 2.2s ease-in-out infinite;
    }

    .closing-line {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 700ms cubic-bezier(0.32, 0.72, 0, 1), transform 700ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .closing-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .word-sequence {
      display: inline;
    }

    .word {
      display: inline-block;
      opacity: 0;
      transition: opacity 220ms ease;
      will-change: opacity;
    }

    .word.visible {
      opacity: 1;
    }

    .progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 3;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, rgba(95, 158, 160, 0.92), rgba(224, 145, 62, 0.92));
      box-shadow: 0 0 10px rgba(95, 158, 160, 0.2);
      transition: width 120ms linear;
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes closingLinkPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .frame {
        width: calc(100vw - 20px);
        min-height: calc(100dvh - 20px);
        padding: 8px;
      }

      .terminal {
        min-height: calc(100dvh - 36px);
      }

      .topbar,
      .controls,
      .viewport {
        padding-left: 12px;
        padding-right: 12px;
      }

      .controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        min-width: 0;
        text-align: left;
      }

      .title {
        max-width: 42vw;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="terminal">
      <div class="topbar">
        <div class="lights" aria-hidden="true">
          <span class="light"></span>
          <span class="light"></span>
          <span class="light"></span>
        </div>
        <div class="title">Sanhedrin Advisory Council // Terminal Replay</div>
        <div class="status" id="status">PLAYING</div>
      </div>

      <div class="viewport" id="viewport">
        <div class="content" id="content" aria-live="polite"></div>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="controls">
        <div class="control-group">
          <button class="btn" id="pauseBtn" type="button">Pause</button>
          <button class="btn" id="replayBtn" type="button" hidden>Replay</button>
        </div>
        <div class="control-group" role="group" aria-label="Playback speed">
          <button class="speed-btn active" data-speed="1" type="button">1x</button>
          <button class="speed-btn" data-speed="1.5" type="button">1.5x</button>
          <button class="speed-btn" data-speed="2" type="button">2x</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const totalDuration = 30;
      const akivaLastLineHold = 3;
      const closingBlankStart = 21 + akivaLastLineHold;
      const closingCardDuration = 4;
      const closingCardStart = totalDuration - closingCardDuration;
      const timeline = {
        setupTypeStart: 0,
        setupTypeEnd: 1.5,
        promptDetailStart: 1.5,
        systemStart: 1.5,
        spinnerStart: 1.5,
        spinnerEnd: 2.5,
        sunStart: 2.5,
        machStart: 5,
        schellingStart: 7.5,
        moreMemosStart: 9.5,
        clustersStart: 9.9,
        akivaTypeStart: 10.8,
        akivaTypeEnd: 12.3,
        akivaJoinStart: 12.3,
        akivaLine1Start: 13.8,
        akivaLine2Start: 15.8,
        akivaLine3Start: 17.8,
        akivaLine4Start: 21,
        clearStart: closingBlankStart,
        closingStart: closingCardStart
      };
      const wordRevealStep = 0.08;
      const wordFadeDuration = 0.22;
      const closingRevealOffsets = [0, 1.1, 2.1, 3.3];
      const viewport = document.getElementById("viewport");
      const content = document.getElementById("content");
      const pauseBtn = document.getElementById("pauseBtn");
      const replayBtn = document.getElementById("replayBtn");
      const speedButtons = Array.from(document.querySelectorAll(".speed-btn"));
      const statusEl = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");

      let currentTime = 0;
      let speed = 1;
      let isPaused = false;
      let hasFinished = false;
      let lastFrame = null;
      let rafId = null;

      const firstBlockText = "/sanhedrin";
      const promptDetailText = [
        "An unlicensed casino offers you 3x commission. Half your competitors",
        "are already in. Do you take the deal?"
      ].join("\n");

      const secondBlockText = "bring in akiva";
      const akivaMoneyLineWords = "A council that does not think uncomfortable thoughts is not earning its seat.".split(" ");

      function escapeHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function typedHtml(text, start, end, className) {
        if (currentTime < start) return "";
        const progress = Math.max(0, Math.min(1, (currentTime - start) / (end - start)));
        const visibleChars = Math.floor(text.length * progress);
        const slice = escapeHtml(text.slice(0, visibleChars));
        const cursor = currentTime >= start && currentTime < end ? '<span class="cursor" aria-hidden="true"></span>' : "";
        return '<div class="line ' + className + '">' + slice.replace(/\n/g, "<br>") + cursor + "</div>";
      }

      function lineHtml(start, html, className) {
        if (currentTime < start) return "";
        return '<div class="line ' + className + '">' + html + "</div>";
      }

      function spinnerHtml(start, end) {
        if (currentTime < start || currentTime > end) return "";
        const frames = ["·", "··", "···", "····"];
        const idx = Math.floor((currentTime - start) * 8) % frames.length;
        return '<div class="line system spinner">' + frames[idx] + "</div>";
      }

      function easedOpacity(start, duration) {
        const progress = Math.max(0, Math.min(1, (currentTime - start) / duration));
        return progress;
      }

      function wordSequenceHtml(start) {
        if (currentTime < start) return "";
        const lastWordStart = start + (akivaMoneyLineWords.length - 1) * wordRevealStep;
        const glowReadyAt = lastWordStart + wordFadeDuration * 0.7;
        const glowClass = currentTime >= glowReadyAt ? " glow" : "";
        const words = akivaMoneyLineWords.map(function (word, index) {
          const revealAt = start + index * wordRevealStep;
          const opacity = easedOpacity(revealAt, wordFadeDuration).toFixed(3);
          return '<span class="word" style="opacity:' + opacity + ';">' + escapeHtml(word) + '&nbsp;</span>';
        }).join("");

        return '<div class="line advisor"><span class="advisor akiva' + glowClass + '"><span class="body word-sequence">' + words + "</span></span></div>";
      }

      function closingHtml(start) {
        if (currentTime < start) return "";
        const githubPulseClass = currentTime >= totalDuration - 3 ? " pulsing" : "";
        const lineStyle = function (offset) {
          const opacity = easedOpacity(start + offset, 0.7);
          const translate = (1 - opacity) * 10;
          return ' style="opacity:' + opacity.toFixed(3) + ";transform:translateY(" + translate.toFixed(3) + 'px);"';
        };
        return [
          '<div class="closing visible">',
          '<div class="closing-inner">',
          '<div class="closing-title closing-line"' + lineStyle(closingRevealOffsets[0]) + '>Sanhedrin</div>',
          '<div class="closing-copy closing-line"' + lineStyle(closingRevealOffsets[1]) + '>Structured disagreement for hard decisions.</div>',
          '<div class="closing-copy dimmer closing-line"' + lineStyle(closingRevealOffsets[2]) + '>7 independent agents. Blind memos. Cross-examination.<br>No consensus guaranteed. That is the point.</div>',
          '<div class="closing-link closing-line"' + lineStyle(closingRevealOffsets[3]) + '><span class="closing-link-text' + githubPulseClass + '">github.com/bambushu/sanhedrin</span></div>',
          "</div>",
          "</div>"
        ].join("");
      }

      function render() {
        const fragments = [];
        const inClosingBlank = currentTime >= timeline.clearStart && currentTime < timeline.closingStart;

        if (!inClosingBlank) {
          fragments.push(typedHtml(firstBlockText, timeline.setupTypeStart, timeline.setupTypeEnd, "user"));
          fragments.push(lineHtml(timeline.promptDetailStart, escapeHtml(promptDetailText).replace(/\n/g, "<br>"), "user"));
          fragments.push(lineHtml(timeline.systemStart, "Sanhedrin convened. Dispatching blind memos...", "system"));
          fragments.push(spinnerHtml(timeline.spinnerStart, timeline.spinnerEnd));

          fragments.push(lineHtml(timeline.sunStart, '<span class="advisor sun"><span class="name">Sun Tzu:</span> <span class="body">The 3x commission is not an offer. It is a test.</span></span>', "advisor"));
          fragments.push(lineHtml(timeline.machStart, '<span class="advisor mach"><span class="name">Machiavelli:</span> <span class="body">They are buying your regulatory cover, your traffic, and your reputation. Not your marketing skills.</span></span>', "advisor"));
          fragments.push(lineHtml(timeline.schellingStart, '<span class="advisor schelling"><span class="name">Schelling:</span> <span class="body">Classic defection temptation in a multi-round coordination game.</span></span>', "advisor"));
          fragments.push(lineHtml(timeline.moreMemosStart, "2 more memos received...", "system"));
          fragments.push(lineHtml(timeline.clustersStart, "3 strategy clusters identified. All 5 advisors say decline. Unanimous.", "system"));

          fragments.push(typedHtml(secondBlockText, timeline.akivaTypeStart, timeline.akivaTypeEnd, "user"));
          fragments.push(lineHtml(timeline.akivaJoinStart, "Rabbi Akiva joins the council.", "system"));
          fragments.push(lineHtml(timeline.akivaLine1Start, '<span class="advisor akiva"><span class="name">Rabbi Akiva:</span> <span class="body">The unanimous \"decline\" is correct on law but may be wrong on reasoning.</span></span>', "advisor"));
          fragments.push(lineHtml(timeline.akivaLine2Start, '<span class="advisor akiva"><span class="body">What if enforcement is slow? What if the unlicensed operator eventually gets licensed? Then your competitors have a three year head start on a now legitimate casino.</span></span>', "advisor"));
          fragments.push(wordSequenceHtml(timeline.akivaLine3Start));
          fragments.push(lineHtml(timeline.akivaLine4Start, '<span class="advisor akiva"><span class="body">The unlicensed casino thinks it is offering you money. It is actually showing you a map. Read the map.</span></span>', "advisor"));
        }

        fragments.push(closingHtml(timeline.closingStart));

        content.innerHTML = fragments.join("");
        content.classList.toggle("fade-out", inClosingBlank);
        viewport.scrollTop = viewport.scrollHeight;
        progressBar.style.width = (currentTime / totalDuration * 100).toFixed(3) + "%";

        if (currentTime >= totalDuration) {
          hasFinished = true;
          isPaused = true;
          currentTime = totalDuration;
          lastFrame = null;
          pauseBtn.textContent = "Pause";
          statusEl.textContent = "COMPLETE";
          replayBtn.hidden = false;
        } else if (isPaused) {
          statusEl.textContent = "PAUSED";
        } else {
          statusEl.textContent = "PLAYING";
        }
      }

      function step(timestamp) {
        if (lastFrame === null) {
          lastFrame = timestamp;
          if (!isPaused && !hasFinished) {
            render();
            rafId = requestAnimationFrame(step);
          }
          return;
        }

        const delta = (timestamp - lastFrame) / 1000;
        lastFrame = timestamp;

        if (!isPaused) {
          currentTime += delta * speed;
          if (currentTime > totalDuration) {
            currentTime = totalDuration;
          }
          render();
        }

        if (!isPaused && !hasFinished) {
          rafId = requestAnimationFrame(step);
        } else {
          rafId = null;
        }
      }

      function setSpeed(nextSpeed) {
        speed = nextSpeed;
        speedButtons.forEach(function (button) {
          button.classList.toggle("active", Number(button.dataset.speed) === nextSpeed);
        });
      }

      function resetPlayback() {
        currentTime = 0;
        isPaused = false;
        hasFinished = false;
        lastFrame = null;
        replayBtn.hidden = true;
        pauseBtn.textContent = "Pause";
        render();
        if (rafId === null) {
          rafId = requestAnimationFrame(step);
        }
      }

      pauseBtn.addEventListener("click", function () {
        if (hasFinished) return;
        isPaused = !isPaused;
        if (!isPaused) {
          lastFrame = null;
        }
        pauseBtn.textContent = isPaused ? "Resume" : "Pause";
        render();
        if (!isPaused && rafId === null) {
          rafId = requestAnimationFrame(step);
        }
      });

      replayBtn.addEventListener("click", function () {
        resetPlayback();
      });

      speedButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          setSpeed(Number(button.dataset.speed));
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.code !== "Space" || event.repeat) return;
        const tagName = event.target && event.target.tagName;
        if (tagName === "INPUT" || tagName === "TEXTAREA" || tagName === "SELECT" || (event.target && event.target.isContentEditable)) {
          return;
        }
        event.preventDefault();
        if (hasFinished) {
          resetPlayback();
          return;
        }
        pauseBtn.click();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden && !hasFinished) {
          isPaused = true;
          lastFrame = null;
          pauseBtn.textContent = "Resume";
          render();
        }
      });

      setSpeed(1);
      render();
      rafId = requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
